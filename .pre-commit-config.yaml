# Hooks run through uv so they use the project's locked tool versions.
# The test suite is not a hook (too slow per commit) - run `uv run pytest`.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: import-linter
        name: import-linter (layer contracts)
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
